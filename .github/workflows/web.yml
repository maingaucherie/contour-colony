# On every push: run the tests, build the browser version with pygbag, and
# (on the default branch) publish it to GitHub Pages so it can be played from
# a link. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Test and publish web build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (headless, standard library only)
        run: python -m unittest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygbag
        run: pip install -r requirements-dev.txt
      - name: Build web version
        run: python -m pygbag --build --template web/contour.tmpl --title "Contour Colony" .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
